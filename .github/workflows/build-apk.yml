name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false

      - name: Install Android Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -O /tmp/templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -o /tmp/templates.tpz \
            -d ~/.local/share/godot/export_templates/4.3.stable/
          
          if [ -d ~/.local/share/godot/export_templates/4.3.stable/templates ]; then
            mv ~/.local/share/godot/export_templates/4.3.stable/templates/* \
              ~/.local/share/godot/export_templates/4.3.stable/
            rmdir ~/.local/share/godot/export_templates/4.3.stable/templates
          fi

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --export-release "Android" \
            build/RunnerGame.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Runner-Game-APK
          path: build/RunnerGame.apk
