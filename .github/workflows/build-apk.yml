name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false

      - name: Import Project
        run: |
          godot --headless --editor --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/RunnerGame.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Runner-Game-APK
          path: build/RunnerGame.apk
