name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false

      - name: Install Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/templates.tpz

          mkdir -p /tmp/godot_templates

          unzip -q \
            /tmp/templates.tpz \
            -d /tmp/godot_templates

          cp -r \
            /tmp/godot_templates/templates/* \
            ~/.local/share/godot/export_templates/4.3.stable/

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Android Paths
        run: |
          mkdir -p ~/.config/godot

          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

      - name: Check Godot
        run: |
          godot --version
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Import Project
        run: |
          godot \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Show Export Preset
        run: |
          echo "===== EXPORT PRESET ====="
          cat export_presets.cfg
          echo "========================"

      - name: Build Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug \
            "Android" \
            build/RunnerGame.apk

      - name: Check APK
        run: |
          echo "===== APK ====="
          ls -lh build/
          test -f build/RunnerGame.apk
          echo "APK BUILD SUCCESSFUL!"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Runner-Game-APK
          path: build/RunnerGame.apk
