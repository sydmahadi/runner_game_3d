name: Build Bubble Shooter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android

          keytool \
            -genkeypair \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable

          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -o Godot_v4.3-stable_export_templates.tpz \
            -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/android_debug.apk \
            ~/.local/share/godot/export_templates/4.3.stable/

          cp /tmp/godot_templates/templates/android_release.apk \
            ~/.local/share/godot/export_templates/4.3.stable/

          cp /tmp/godot_templates/templates/android_source.zip \
            ~/.local/share/godot/export_templates/4.3.stable/

      - name: Create Export Preset
        run: |
          cat > export_presets.cfg <<'EOF'
          [preset.0]

          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/BubbleShooter.apk"

          [preset.0.options]

          package/unique_name="com.talpatarsepai.bubbleshooter"
          package/name="Bubble Shooter"

          version/code=1
          version/name="1.0"

          architecture/arm64-v8a=true
          architecture/armeabi-v7a=false
          architecture/x86=false
          architecture/x86_64=false

          screen/immersive_mode=true
          screen/orientation=1

          keystore/debug="/home/runner/.android/debug.keystore"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"

          keystore/release=""
          keystore/release_user=""
          keystore/release_password=""
          EOF

      - name: Import Project
        run: |
          godot --headless --editor --quit

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/BubbleShooter.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bubble-Shooter-APK
          path: build/BubbleShooter.apk
