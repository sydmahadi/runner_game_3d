name: Build Bubble Shooter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false

      - name: Install Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz

          unzip -o \
            Godot_v4.3-stable_export_templates.tpz \
            -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/android_debug.apk \
            ~/.local/share/godot/export_templates/4.3.stable/

          cp /tmp/godot_templates/templates/android_release.apk \
            ~/.local/share/godot/export_templates/4.3.stable/

          cp /tmp/godot_templates/templates/android_source.zip \
            ~/.local/share/godot/export_templates/4.3.stable/

      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android

          keytool \
            -genkeypair \
            -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Check Project
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 2 -type f
          echo "========================="

      - name: Import Godot Project
        run: |
          godot --headless --editor --quit

      - name: Build Android
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug \
            "Android" \
            build/BubbleShooter.apk

      - name: Show Build Files
        if: always()
        run: |
          echo "===== BUILD DIRECTORY ====="
          ls -lah build || true
          echo "==========================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Bubble-Shooter-APK
          path: build/BubbleShooter.apk
