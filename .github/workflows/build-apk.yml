name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.3.0"
          use-dotnet: false

      - name: Install Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates
          cp -r /tmp/godot_templates/templates/* \
            ~/.local/share/godot/export_templates/4.3.stable/

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/RunnerGame.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Runner-Game-APK
          path: build/RunnerGame.apk
