name: "Godot 4.3 Android Build"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  export-android:
    runs-on: ubuntu-latest
    name: Export Android APK

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Debug Keystore
        run: |
          mkdir -p /home/runner/.android
          keytool -genkey -v -keystore /home/runner/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Godot Engine & Export Templates
        run: |
          GODOT_VERSION="4.3"
          GODOT_RELEASE="stable"
          
          # Download Godot Engine Executable
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          unzip Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64 godot
          chmod +x godot
          
          # Download & Extract Export Templates
          wget https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          unzip Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz -d temp_templates
          mv temp_templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/
          rm -rf temp_templates Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz

      - name: Create Build Directory
        run: mkdir -p build

      - name: Build Android APK
        run: |
          ./godot --headless --export-release "Android" build/BubbleShooter.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbleShooter-APK
          path: build/BubbleShooter.apk
